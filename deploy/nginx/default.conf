# ================================================================
# MonaWMS · Nginx 站点配置
#
# 端口规划（容器内端口 = 宿主机映射端口）：
#   9080  ThinkPHP API（internal，不对外映射，仅容器网络/本机回环可达）
#   9110  WMS 前端（frontend/dist，/api/ 反代到 9080）
#   9111  uniapp H5（预留，产物目录为空时返回 404 属预期）
# ================================================================

# ---------- 全局安全与限流（本文件被 include 在 http 上下文，故此处为 http 级指令） ----------
# 隐藏 nginx 版本号，降低指纹嗅探
server_tokens off;

# 超时收紧：防慢速连接长时间占用连接
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 15s;
#
# ★ 注意：keepalive_timeout 不要写在这里！
#   镜像自带 /etc/nginx/nginx.conf 的 http 块已有定义，重复定义会
#   [emerg] "keepalive_timeout" directive is duplicate 导致 nginx 无法启动。
#   需要收紧时写在各 server 块内（server 上下文允许覆盖 http 级）。

# WMS 为内部作业系统（用户量小）：限流放宽演示值
# 生产对外暴露时建议恢复 150r/m 与 10r/m
limit_req_zone $binary_remote_addr zone=perip:10m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=connperip:10m;
limit_conn connperip 100;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# ---------- 内部：ThinkPHP API ----------
server {
    listen 9080;
    server_name _;
    keepalive_timeout 30s;
    # 此 root 有两个用途，因此 nginx 与 php 容器对 backend_tp6 的挂载点
    # 必须一致（docker-compose.yml 中均为 /var/www/html）：
    #   1) 拼进 fastcgi_param SCRIPT_FILENAME 交 php-fpm 解析，
    #      路径不存在时 php-fpm 报 "Primary script unknown"，接口全部 404；
    #   2) nginx 自身判断静态文件是否存在（if (!-e $request_filename)），
    #      否则 /storage、/uploads 等直出文件会被误 rewrite 进 index.php。
    root /var/www/html/public;
    index index.php;

    # xlsx 批量导入 / 报废图片附件上传
    client_max_body_size 50m;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/$1 last;
        }
    }

    location ~ \.php(.*)$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^((?U).+\.php)(/?.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_read_timeout 300s;
        include fastcgi_params;
    }
}

# ---------- WMS 前端（React 18 + AntD 5） ----------
server {
    listen 9110;
    server_name _;
    keepalive_timeout 30s;
    root /var/www/frontend/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由兜底
    location / {
        limit_req zone=perip burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # 登录接口独立更严格限流，防密码爆破
    # 精确匹配优先级高于下方 location /api/
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端 axios 生产 baseURL=/api（frontend/.env.production）
    # → ThinkPHP /api 路由组（route/app.php 的 Route::group('api', ...)）
    # 自定义头 X-Warehouse-Id 由 proxy 默认透传，无需额外配置
    location /api/ {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---------- uniapp H5（PDA / 移动端，预留） ----------
server {
    listen 9111;
    server_name _;
    keepalive_timeout 30s;
    root /var/www/h5/dist;
    index index.html;

    # 产物目录为空（尚未发行 H5）时，此端口返回 403/404 属预期
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 端 API 地址在 uniapp 本地构建时配置（指向 http://<公网IP>:9110/api）；
    # 若后续改为同源 /api 相对路径，再启用下方反代
    # location /api/ {
    #     proxy_pass http://127.0.0.1:9080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
