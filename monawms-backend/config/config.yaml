# MonaWms 后端运行配置（应用运行时读取，与 .env 的数据库连接保持一致）
server:
  default:
    server_name: "monawms"
    address: ":8080"
    server_locale: "zh"
    read_timeout: "30s"
    write_timeout: "30s"
    idle_timeout: "60s"
    health_check: "/health"
    graceful_enable: true
    graceful_timeout: "10s"
    graceful_wait_time: "0s"
    openapi_path: "/api.json"
    swagger_path: "/swagger"
    print_routes: true

database:
  default:
    type: "mysql"
    host: "127.0.0.1"
    port: "3306"
    user: "root"
    password: "root"
    db_name: "monawms"
    max_idle_connection: 10
    max_open_connection: 100
    slow_threshold: "500ms"

# JWT 由业务代码自行解析（Phase 1 的 internal/logic/auth.go）
jwt:
  secret: "monawms_jwt_secret_key_2024"
  access_expire: "2h"
  refresh_expire: "168h"
