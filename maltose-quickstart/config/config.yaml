server:
  default:
    server_name: "maltose-quickstart"
    address: ":8081"
    server_locale: "zh"
    read_timeout: "30s"
    write_timeout: "30s"
    idle_timeout: "60s"
    health_check: "/health"
    graceful_enable: true
    graceful_timeout: "10s"
    graceful_wait_time: "0s"
    openapi_path: "/api.json"
    swagger_path: "/swagger"
    print_routes: true
