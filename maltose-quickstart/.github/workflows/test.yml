name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验模块
        run: |
          set -euo pipefail
          go mod tidy -diff
          go vet ./...
          go test -race ./...
          go build ./...
