<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仪表板 - 通信设备WMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 顶部导航栏 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #1e3c72;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .menu-btn:hover {
            background: rgba(30, 60, 114, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            color: #1e3c72;
        }
        
        .logo i {
            margin-right: 8px;
            font-size: 20px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1e3c72;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* 主内容区域 */
        .main-content {
            padding: 80px 20px 100px;
        }
        
        /* 欢迎卡片 */
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .welcome-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 8px;
        }
        
        .welcome-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:active {
            transform: scale(0.95);
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 20px;
            color: white;
        }
        
        .stat-icon.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .stat-icon.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-icon.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .stat-icon.info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .stat-change {
            font-size: 11px;
            color: #28a745;
        }
        
        /* 快捷操作 */
        .quick-actions {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 15px;
        }
        
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(30, 60, 114, 0.1);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #1e3c72;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .action-btn:active {
            transform: scale(0.95);
            background: rgba(30, 60, 114, 0.1);
        }
        
        .action-btn i {
            font-size: 20px;
            margin-bottom: 8px;
            color: #667eea;
        }
        
        .action-btn span {
            font-size: 12px;
            font-weight: 500;
        }
        
        /* 最近活动 */
        .recent-activity {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
            color: white;
        }
        
        .activity-icon.create {
            background: #28a745;
        }
        
        .activity-icon.update {
            background: #ffc107;
        }
        
        .activity-icon.delete {
            background: #dc3545;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }
        
        .activity-time {
            font-size: 12px;
            color: #666;
        }
        
        /* 左侧抽屉菜单 */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1600;
            transition: left 0.3s ease;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
        }
        
        .drawer.active {
            left: 0;
        }
        
        .drawer-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .drawer-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .drawer-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .drawer-menu {
            padding: 20px 0;
        }
        
        .menu-section {
            margin-bottom: 30px;
        }
        
        .menu-section-title {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 20px;
            margin-bottom: 10px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .menu-item:hover {
            background: rgba(102, 126, 234, 0.1);
            border-left-color: #667eea;
        }
        
        .menu-item.active {
            background: rgba(102, 126, 234, 0.15);
            border-left-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }
        
        .menu-item i {
            width: 20px;
            margin-right: 15px;
            font-size: 16px;
        }
        
        .menu-item-text {
            font-size: 14px;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            padding: 5px;
            transition: color 0.3s ease;
        }
        
        .nav-item.active {
            color: #667eea;
        }
        
        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
        }
        
        .nav-item span {
            font-size: 10px;
        }
        
        /* 响应式设计 */
        @media (max-width: 375px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .actions-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* 触摸反馈 */
        .touchable {
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 左侧抽屉菜单 -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="drawer-title">通信设备WMS</div>
            <div class="drawer-subtitle">仓库管理系统</div>
        </div>
        <div class="drawer-menu">
            <div class="menu-section">
                <div class="menu-section-title">主要功能</div>
                <a href="dashboard.html" class="menu-item active">
                    <i class="fas fa-tachometer-alt"></i>
                    <span class="menu-item-text">仪表板</span>
                </a>
                <a href="warehouse.html" class="menu-item">
                    <i class="fas fa-warehouse"></i>
                    <span class="menu-item-text">仓库管理</span>
                </a>
                <a href="devices.html" class="menu-item">
                    <i class="fas fa-mobile-alt"></i>
                    <span class="menu-item-text">设备登记</span>
                </a>
            </div>
            <div class="menu-section">
                <div class="menu-section-title">库存管理</div>
                <a href="inbound.html" class="menu-item">
                    <i class="fas fa-arrow-down"></i>
                    <span class="menu-item-text">入库管理</span>
                </a>
                <a href="outbound.html" class="menu-item">
                    <i class="fas fa-arrow-up"></i>
                    <span class="menu-item-text">出库管理</span>
                </a>
                <a href="scrap.html" class="menu-item">
                    <i class="fas fa-trash-alt"></i>
                    <span class="menu-item-text">报废管理</span>
                </a>
            </div>
            <div class="menu-section">
                <div class="menu-section-title">系统功能</div>
                <a href="reports.html" class="menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span class="menu-item-text">报表统计</span>
                </a>
                <a href="logs.html" class="menu-item">
                    <i class="fas fa-history"></i>
                    <span class="menu-item-text">操作日志</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-content">
            <button class="menu-btn" onclick="openDrawer()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="logo">
                <i class="fas fa-warehouse"></i>
                <span>设备WMS</span>
            </div>
            <div class="user-info">
                <div class="user-avatar">管</div>
                <span>管理员</span>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 欢迎卡片 -->
        <div class="welcome-card">
            <h1 class="welcome-title">欢迎回来！</h1>
            <p class="welcome-subtitle">今天是 <span id="currentDate"></span></p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card touchable">
                <div class="stat-icon primary">
                    <i class="fas fa-boxes"></i>
                </div>
                <div class="stat-number">1,258</div>
                <div class="stat-label">总设备数</div>
                <div class="stat-change">+5%</div>
            </div>
            
            <div class="stat-card touchable">
                <div class="stat-icon success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-number">856</div>
                <div class="stat-label">在库设备</div>
                <div class="stat-change">92%</div>
            </div>
            
            <div class="stat-card touchable">
                <div class="stat-icon warning">
                    <i class="fas fa-arrow-down"></i>
                </div>
                <div class="stat-number">142</div>
                <div class="stat-label">本月入库</div>
                <div class="stat-change">+12%</div>
            </div>
            
            <div class="stat-card touchable">
                <div class="stat-icon info">
                    <i class="fas fa-arrow-up"></i>
                </div>
                <div class="stat-number">98</div>
                <div class="stat-label">本月出库</div>
                <div class="stat-change">-3%</div>
            </div>
        </div>

        <!-- 快捷操作 -->
        <div class="quick-actions">
            <h2 class="section-title">快捷操作</h2>
            <div class="actions-grid">
                <a href="inbound.html" class="action-btn touchable">
                    <i class="fas fa-plus-circle"></i>
                    <span>新增入库</span>
                </a>
                <a href="outbound.html" class="action-btn touchable">
                    <i class="fas fa-minus-circle"></i>
                    <span>设备出库</span>
                </a>
                <a href="devices.html" class="action-btn touchable">
                    <i class="fas fa-search"></i>
                    <span>查找设备</span>
                </a>
                <a href="warehouse.html" class="action-btn touchable">
                    <i class="fas fa-warehouse"></i>
                    <span>仓库管理</span>
                </a>
                <a href="reports.html" class="action-btn touchable">
                    <i class="fas fa-chart-line"></i>
                    <span>数据报表</span>
                </a>
                <a href="scrap.html" class="action-btn touchable">
                    <i class="fas fa-trash"></i>
                    <span>报废申请</span>
                </a>
            </div>
        </div>

        <!-- 最近活动 -->
        <div class="recent-activity">
            <h2 class="section-title">最近活动</h2>
            <div class="activity-item">
                <div class="activity-icon create">
                    <i class="fas fa-plus"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-title">新增华为5G基站设备</div>
                    <div class="activity-time">2分钟前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon update">
                    <i class="fas fa-edit"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-title">更新中兴光纤设备库存</div>
                    <div class="activity-time">15分钟前</div>
                </div>
            </div>
            
            <div class="activity-item">
                <div class="activity-icon delete">
                    <i class="fas fa-trash"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-title">删除报废设备记录</div>
                    <div class="activity-time">1小时前</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-tachometer-alt"></i>
                <span>仪表板</span>
            </a>
            <a href="warehouse.html" class="nav-item">
                <i class="fas fa-warehouse"></i>
                <span>仓库</span>
            </a>
            <a href="devices.html" class="nav-item">
                <i class="fas fa-mobile-alt"></i>
                <span>设备</span>
            </a>
            <a href="inbound.html" class="nav-item">
                <i class="fas fa-arrow-down"></i>
                <span>入库</span>
            </a>
            <a href="outbound.html" class="nav-item">
                <i class="fas fa-arrow-up"></i>
                <span>出库</span>
            </a>
        </div>
    </nav>

    <script>
        // 设置当前日期
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });

        // 添加触摸反馈
        document.querySelectorAll('.touchable').forEach(element => {
            element.addEventListener('touchstart', function() {
                this.style.opacity = '0.7';
            });
            
            element.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });

        // 模拟数据刷新
        function refreshData() {
            const statNumbers = document.querySelectorAll('.stat-number');
            statNumbers.forEach(stat => {
                const currentValue = parseInt(stat.textContent.replace(/,/g, ''));
                const newValue = currentValue + Math.floor(Math.random() * 10) - 5;
                stat.textContent = newValue.toLocaleString();
            });
        }

        // 每30秒刷新一次数据
        setInterval(refreshData, 30000);

        // 抽屉菜单控制
        function openDrawer() {
            document.getElementById('drawer').classList.add('active');
            document.getElementById('drawerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('drawerOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('移动端仪表板加载完成');
        });
    </script>
</body>
</html>
